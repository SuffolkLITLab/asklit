<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AskLit</title><link rel="icon" href="/static/brand/favicon.svg"><link rel="stylesheet" href="/static/studio.css"><script src="/static/public-chat.js" defer></script></head>
<body><header><a href="/gallery" class="brand"><img src="/static/brand/lit-lab.svg" alt="Suffolk LIT Lab"><span class="product">AskLit</span></a><a href="/gallery" class="quiet button">Gallery</a></header>
<main id="public-chat" data-bot-id="{{ bot_id }}" data-opener="{{ opener }}"><h1 id="chat-title">AskLit</h1><p id="chat-error" class="error-text" role="alert"></p><p id="chat-status" role="status">Loading…</p>
<form id="unlock" class="panel" hidden><label>Password<input id="chat-password" type="password" autocomplete="current-password" maxlength="200" required></label><button>Open AskLit</button></form>
<div id="org-unlock" class="panel" hidden><a id="chat-signin" class="button" href="{{ signin }}">Sign in to your organization</a><button id="org-continue" hidden>Continue</button></div>
<div id="chat-content" hidden><p id="chat-opening"></p><label id="chat-profile-label" hidden>Topic<select id="chat-profile"></select></label><div id="chat-starters" class="actions"></div><div id="chat-messages" class="transcript" role="log" aria-live="polite"></div><div id="chat-files" class="attachment-list"></div><form id="chat-send"><label for="chat-question" class="sr-only">Your question</label><div class="chat-composer"><textarea id="chat-question" rows="2" maxlength="8000" placeholder="Ask a question…" required></textarea><button id="chat-attach" type="button" class="attach-button quiet" aria-label="Attach file" title="Attach file" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-9 9a6 6 0 0 1-8.5-8.5l10-10a4 4 0 0 1 5.7 5.7l-10 10a2 2 0 0 1-2.8-2.8l9-9"/></svg></button><input id="chat-file" type="file" hidden><button id="chat-submit" class="send-arrow" aria-label="Send" title="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div><div class="actions"><button id="chat-clear" type="button" class="quiet">Clear conversation</button></div></form><p id="chat-upload-note" class="muted" hidden>Up to 3 files, 5 MB each. Extracted text is sent to this AskLit’s model with your questions and retained with this conversation.</p><p id="chat-footer" class="muted"></p></div>
</main><footer><img src="/static/brand/lit-lab-full.svg" alt="Legal Innovation & Technology Lab, Suffolk University Law School"></footer></body></html>
