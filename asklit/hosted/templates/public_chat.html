<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AskLit</title><link rel="icon" href="/static/brand/favicon.svg"><link rel="stylesheet" href="/static/studio.css"><script src="/static/public-chat.js" defer></script></head>
<body><header><a href="/gallery" class="brand"><img src="/static/brand/lit-lab.svg" alt="Suffolk LIT Lab"><span class="product">AskLit</span></a><a href="/gallery" class="quiet button">Gallery</a></header>
<main id="public-chat" data-bot-id="{{ bot_id }}" data-opener="{{ opener }}"><h1 id="chat-title">AskLit</h1><p id="chat-error" class="error-text" role="alert"></p><p id="chat-status" role="status">Loading…</p>
<form id="unlock" class="panel" hidden><label>Password<input id="chat-password" type="password" autocomplete="current-password" maxlength="200" required></label><button>Open AskLit</button></form>
<div id="org-unlock" class="panel" hidden><a id="chat-signin" class="button" href="{{ signin }}">Sign in to your organization</a><button id="org-continue" hidden>Continue</button></div>
<div id="chat-content" hidden><p id="chat-opening"></p><label id="chat-profile-label" hidden>Topic<select id="chat-profile"></select></label><div id="chat-starters" class="actions"></div><div id="chat-messages" class="transcript" role="log" aria-live="polite"></div><div id="chat-files" class="attachment-list"></div><form id="chat-send"><label for="chat-question" class="sr-only">Your question</label><div class="chat-composer"><textarea id="chat-question" rows="2" maxlength="8000" placeholder="Ask a question…" required></textarea><button id="chat-attach" type="button" class="attach-button quiet" aria-label="Attach file" title="Attach file" hidden><svg viewBox="0 0 448 512" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc. --><path d="M364.2 83.8c-24.4-24.4-64-24.4-88.4 0l-184 184c-42.1 42.1-42.1 110.3 0 152.4s110.3 42.1 152.4 0l152-152c10.9-10.9 28.7-10.9 39.6 0s10.9 28.7 0 39.6l-152 152c-64 64-167.6 64-231.6 0s-64-167.6 0-231.6l184-184c46.3-46.3 121.3-46.3 167.6 0s46.3 121.3 0 167.6l-176 176c-28.6 28.6-75 28.6-103.6 0s-28.6-75 0-103.6l144-144c10.9-10.9 28.7-10.9 39.6 0s10.9 28.7 0 39.6l-144 144c-6.7 6.7-6.7 17.7 0 24.4s17.7 6.7 24.4 0l176-176c24.4-24.4 24.4-64 0-88.4z"/></svg></button><input id="chat-file" type="file" hidden><button id="chat-submit" class="send-arrow" aria-label="Send" title="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div><div class="actions"><button id="chat-clear" type="button" class="quiet">Clear conversation</button></div></form><p id="chat-upload-note" class="muted" hidden>Up to 3 files, 5 MB each. Extracted text is sent to this AskLit’s model with your questions and retained with this conversation.</p><p id="chat-footer" class="muted"></p></div>
</main><footer><img src="/static/brand/lit-lab-full.svg" alt="Legal Innovation & Technology Lab, Suffolk University Law School"></footer></body></html>
